    segment: hybrid-commercial
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 3.0
      source: "HEV medium-truck battery ~3-5 kWh"
    mirror_flag: watch

  - hs: "870453"
    desc: "Goods vehicles >20t, spark-ignition hybrid"
    segment: hybrid-commercial
