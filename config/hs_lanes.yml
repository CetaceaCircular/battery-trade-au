    mirror_flag: clean

  # ---- Tripwire -------------------------------------------------------------
  - hs: "870410"
    desc: "Dumpers for off-highway use (mining trucks — unsplit by propulsion)"
    segment: mining-tripwire
    role: tripwire
    weight_basis: cn_netwgt
    conversion:
      method: none
    mirror_flag: tripwire
    notes: >
      AU flow historically ~zero via Comtrade (Cat/Komatsu/Hitachi dealer channels)
      while China->World hit US$2.2B / 493 kt 2025. Code is unsplit by propulsion:
      any AU arrival is a flag for manual review, not an automatic battery claim.

  # ---- Co-import signature lanes (storage / swap detection) -----------------
  - hs: "850440"
