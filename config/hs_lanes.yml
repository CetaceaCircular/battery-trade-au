# ============================================================================
# China -> Australia battery trade model — HS lane taxonomy & conversion config
# ----------------------------------------------------------------------------
# Everything the pipeline knows about HS codes lives here. No lane, segment or
# conversion assumption is hardcoded in src/. Edit this file to add lanes or
# revise assumptions; every GWh figure in the outputs traces back to a row
# below plus a Comtrade record.
#
# Roles:
#   pool       battery-energy lane — contributes GWh to the placed-on-market pool
#   signature  co-import signature lane (storage / swap detection) — kt + US$ only
#   tripwire   watch item — arrivals trigger a flag (e.g. 870410 mining trucks)
#   context    3C / lead-acid reference — tonnage + value only, not in the GWh pool
#   waste      8549xx end-of-life outward-flow watch
#
# weight_basis:
#   cn_netwgt  tonnage taken from China-reported exports (netWgt reliably reported)
#   au_qty     AU-reported quantity (used only where CN weight is unavailable)
#
# conversion.method:
#   kg_per_kwh    GWh = netWgt_t * 1000 / kg_per_kwh / 1e6
#   kwh_per_unit  GWh = qty_units * kwh_per_unit * li_share / 1e6
#   none          no energy conversion (signature / context lanes)
# ============================================================================

version: 1

reporters:
  australia: 36
  china: 156

periods:
  annual_start: 2019
  annual_end: 2025        # rolled forward by fetch.py to the latest available year
  quarterly_latest_n: 8   # quarterly pull covers the latest 8 quarters (needs API key)

# Validation anchors (see docs/method.md §6). These are CALIBRATION TARGETS
# recorded from the verified 2026-11 analysis cycle, not model inputs.
anchors:
  pom_pool_cum_gwh_2019_2025: 70.9   # verified AU placed-on-market pool 2019-2025
  lane_850760_gwh_2025: 31.0         # ~250 kt large-format packs, 2025
  tolerance: 0.10                    # CI gate: reproduced totals within +/-10%

lanes:

  # ---- Core battery-energy lanes (the GWh pool) ---------------------------
  - hs: "850760"
    desc: "Li-ion accumulators (packs, all formats)"
    segment: mixed-large-format
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kg_per_kwh
      kg_per_kwh: 8.0
      source: "Blended pack-level density ~125 Wh/kg across EV/ESS/cell formats (IEA GEVO pack densities; OEM pack specs 120-160 Wh/kg)"
    mirror_flag: core
    notes: >
      Tonnage is the pool spine. Item counts (20M+ units/yr) include small cells,
      but at <1 kt aggregate small-format mass the tonnage is effectively all
      large-format — see docs/method.md §3.2.

  - hs: "870380"
    desc: "Passenger battery-electric vehicles (BEV)"
    segment: passenger-ev
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 60.0
      source: "Blended pack size of China-sourced BEVs sold in AU (Tesla Model 3/Y, BYD Atto 3/Seal/Dolphin, MG4, GWM Ora ~50-83 kWh)"
    mirror_flag: clean

  - hs: "870340"
    desc: "Passenger hybrids (HEV)"
    segment: passenger-hybrid
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 1.5
      source: "HEV battery ~1-2 kWh (Toyota/Geely hybrid references)"
    mirror_flag: clean

  - hs: "870350"
    desc: "Passenger diesel hybrids (HEV)"
    segment: passenger-hybrid
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 1.5
      source: "HEV battery ~1-2 kWh"
    mirror_flag: clean

  - hs: "870360"
    desc: "Passenger plug-in hybrids (PHEV)"
    segment: passenger-phev
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 18.0
      source: "PHEV pack ~15-25 kWh (BYD Shark/Seal U, MG HS PHEV references)"
    mirror_flag: clean

  - hs: "870370"
    desc: "Passenger diesel plug-in hybrids (PHEV)"
    segment: passenger-phev
    role: pool
    weight_basis: cn_netwgt
    conversion:
      method: kwh_per_unit
      kwh_per_unit: 18.0
      source: "PHEV pack ~15-25 kWh"
    mirror_flag: clean

  # ---- Commercial / freight lanes -----------------------------------------
  - hs: "870240"
